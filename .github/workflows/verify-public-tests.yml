name: Verify ReiyCode public tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Verify all public C++ reference tests
        run: node scripts/verify-public-tests.mjs
      - name: Verify every public test against Judge0 CE
        run: node scripts/verify-judge0-public-tests.mjs
